name: FarmersMarket
version: '${project.version}'
main: org.xpfarm.farmersmarket.FarmersMarketPlugin
api-version: '26.1'
author: Carmelo Santana
website: https://xpfarm.org
description: Player-run market economy where diamonds buy goods, XP pays the fees, and vendors shaped like wandering traders sell your stock around the clock

# Floodgate is reached reflectively and is never on the compile classpath. Declared here purely
# for load ordering; every failure in the reflective chain resolves the player to Java edition.
softdepend: [Floodgate]

# The SQLite JDBC driver is loaded at runtime rather than shaded. Paper still bundles
# org.xerial:sqlite-jdbc, but its own build file marks that as legacy and "eventually to be
# removed", so the plugin owns its driver. Version pending confirmation at gate 4.
libraries:
  - org.xerial:sqlite-jdbc:3.53.2.0

# Commands and permissions are declared for what this build actually implements, and nothing
# more. Listings, vendors, stalls, charts, and the community pot belong to M2-M5 and re-add
# their own nodes alongside the code that reads them; declaring them early tells an operator
# they have a knob that does nothing.
commands:
  market:
    description: Check your diamond balance, deposit diamonds, and withdraw them again
    usage: /market [balance | deposit | withdraw | reload]
    aliases: [mkt, fm]

permissions:
  farmersmarket.use:
    description: Check your balance, deposit diamonds, and withdraw them
    default: true
  farmersmarket.admin:
    description: All Farmers Market administration
    default: op
    children:
      farmersmarket.admin.reload: true
  farmersmarket.admin.reload:
    description: Reload the Farmers Market configuration
    default: op
